<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C1433">
  <meta name="color-scheme" content="dark">
  <title>Nova</title>
  <meta name="description" content="Scarica Nova per iPhone e Android.">
  <meta property="og:title" content="Nova">
  <meta property="og:image" content="https://nova-app.shop/img/icona.png">
  <meta name="apple-itunes-app" content="app-id=6758732879">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/img/icona.svg">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <script>document.documentElement.classList.add("js");</script>
  <style>
    @font-face { font-family: "Inter"; src: url("/fonts/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }

    :root {
      --viola: #2A1C44;
      --mezzo: #171B36;
      --notte: #05081A;
      --gradiente: linear-gradient(180deg, var(--viola) 0%, var(--mezzo) 50%, var(--notte) 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--notte); }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: var(--gradiente) fixed;
      min-height: 100svh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .bagliore {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 36%, rgba(120, 100, 180, 0.22) 0%, rgba(120, 100, 180, 0) 40%);
    }

    main {
      position: relative;
      height: 100svh; max-width: 420px; margin: 0 auto;
      display: flex; flex-direction: column; align-items: center;
      padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 40px);
    }
    .scena { flex: 1; display: grid; place-items: center; width: 100%; }
    .scena { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .simbolo { width: 150px; height: 151px; color: #fff; }

    .scarica { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .pulsante {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 60px; padding: 0 22px; border-radius: 30px;
      font-size: 18px; font-weight: 600; text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease;
    }
    .pulsante:active { transform: scale(0.98); }
    .pulsante:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .pulsante svg { width: 24px; height: 24px; flex: 0 0 auto; }
    .pieno { background: #fff; color: #2A1C44; }
    .vuoto { color: #fff; border: 1.5px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.05); }

    /* Senza JavaScript tutto è già al suo posto. Con JavaScript: prima la splash, poi il simbolo
       vola al suo posto, poi compaiono i pulsanti. */
    .js .simbolo { position: relative; z-index: 11; color: #2A1C44; }
    .js .pulsante { opacity: 0; transform: translateY(14px); }
    .js .pronta .pulsante { opacity: 1; transform: none; transition: opacity 0.5s ease, transform 0.5s ease; }
    .js .pronta .pulsante { transition-delay: 0.25s; }
    .js .pronta .pulsante + .pulsante { transition-delay: 0.37s; }

    .splash { display: none; }
    .js .splash {
      display: block; position: fixed; inset: 0; z-index: 10; pointer-events: none;
    }
    .splash .bianco {
      position: absolute; inset: 0; background: #fff;
      animation: bianco-via 1.6s ease-in-out 0.25s forwards;
    }
    @keyframes bianco-via { to { opacity: 0; } }

    /* Android non è ancora pubblicata: il pulsante apre questo avviso. */
    dialog {
      margin: auto; width: calc(100% - 48px); max-width: 360px;
      padding: 28px 24px 24px; border: 1.5px solid rgba(255, 255, 255, 0.14); border-radius: 28px;
      background: var(--mezzo); color: #fff; text-align: center;
    }
    dialog::backdrop { background: rgba(5, 8, 26, 0.7); }
    dialog h2 { font-size: 20px; font-weight: 600; }
    dialog p { margin: 10px 0 22px; font-size: 16px; line-height: 1.45; color: rgba(255, 255, 255, 0.72); }
    dialog button { width: 100%; border: 0; font-family: inherit; cursor: pointer; }
    .js dialog .pulsante { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <div class="bagliore" aria-hidden="true"></div>
  <div class="splash" aria-hidden="true"><div class="bianco"></div></div>

  <main aria-label="Nova">
    <div class="scena"><svg class="simbolo" viewBox="0 0 395 397" aria-hidden="true"><g transform="matrix(1,0,0,1,-102.918255,-98.145313)"><g transform="matrix(0.1,0,0,-0.1,0,600)"><path d="M2645,5008C2388,4959 2279,4925 2100,4839C1545,4572 1157,4059 1050,3454C1024,3308 1022,2969 1046,2828C1096,2525 1211,2251 1388,2010C1503,1854 1766,1568 1885,1470C2126,1272 2409,1140 2735,1073C2866,1047 3304,1047 3435,1073C3616,1110 3756,1157 3915,1235C4360,1451 4717,1852 4874,2312C4955,2549 4970,2647 4970,2944C4970,3153 4967,3192 4945,3303C4882,3621 4741,3915 4537,4155C4387,4332 4357,4366 4288,4438C4095,4640 3870,4793 3626,4889C3459,4954 3385,4975 3200,5005C3102,5022 2726,5023 2645,5008ZM2980,4773C2980,4715 2942,4468 2914,4341C2819,3914 2672,3600 2465,3382C2362,3272 2279,3210 2155,3149C2041,3092 1906,3056 1775,3045L1685,3037L1790,3019C2125,2962 2414,2777 2628,2482C2699,2384 2804,2177 2848,2049C2913,1863 2967,1588 2986,1348L2992,1261L2964,1254C2929,1245 2602,1276 2513,1296C2267,1354 2069,1438 1868,1571C1678,1697 1591,1788 1474,1985C1205,2440 1143,3024 1311,3525C1500,4086 1940,4529 2494,4715C2623,4758 2853,4806 2943,4809C2979,4810 2980,4809 2980,4773ZM3350,4795C3611,4752 3737,4712 3944,4609C4140,4511 4332,4366 4416,4253C4598,4007 4714,3729 4765,3420C4789,3276 4789,2993 4765,2850C4730,2638 4677,2473 4586,2291C4336,1790 3862,1419 3317,1300C3227,1280 3022,1255 3014,1262C3012,1265 3017,1325 3025,1396C3119,2205 3414,2745 3869,2941C3978,2987 4100,3018 4213,3026C4261,3030 4298,3035 4296,3037C4294,3039 4259,3046 4218,3052C4121,3065 3975,3112 3868,3165C3434,3380 3153,3814 3051,4430C3031,4549 3010,4735 3010,4786L3010,4810L3138,4810C3208,4810 3303,4803 3350,4795Z" fill="currentColor"/></g></g></svg></div>
    <div class="scarica">
      <a id="ios" class="pulsante pieno" href="https://apps.apple.com/it/app/nova/id6758732879" rel="noopener" aria-label="Scarica Nova per iPhone">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.62c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.7 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.19-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.6 2.25 2.74 2.21 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.08 2.65-2.15.84-1.23 1.18-2.42 1.2-2.48-.03-.01-2.3-.88-2.32-3.5zM14.2 6.17c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.22z"/></svg>
        iPhone
      </a>
      <a id="android" class="pulsante vuoto" href="#" role="button" aria-haspopup="dialog" aria-label="Nova per Android">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 9.48l1.84-3.18a.38.38 0 0 0-.66-.38l-1.86 3.22a11.46 11.46 0 0 0-9.84 0L5.22 5.92a.38.38 0 0 0-.66.38L6.4 9.48A10.78 10.78 0 0 0 1 18h22a10.78 10.78 0 0 0-5.4-8.52zM7 15.25A1.25 1.25 0 1 1 8.25 14 1.25 1.25 0 0 1 7 15.25zm10 0A1.25 1.25 0 1 1 18.25 14 1.25 1.25 0 0 1 17 15.25z"/></svg>
        Android
      </a>
    </div>
  </main>

  <dialog id="presto" aria-labelledby="presto-titolo">
    <h2 id="presto-titolo">Presto su Android</h2>
    <p>Nova per Android sarà disponibile a breve.</p>
    <form method="dialog"><button class="pulsante pieno">Ok</button></form>
  </dialog>

  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var android = /Android/i.test(ua);
      var a = document.getElementById("android"), i = document.getElementById("ios");
      if (android) { a.parentNode.insertBefore(a, i); a.className = "pulsante pieno"; i.className = "pulsante vuoto"; }

      var presto = document.getElementById("presto");
      a.addEventListener("click", function (e) {
        e.preventDefault();
        if (presto.showModal) presto.showModal(); else alert("Nova per Android sarà disponibile a breve.");
      });
      // Un tocco fuori dalla scheda chiude l'avviso.
      presto.addEventListener("click", function (e) { if (e.target === presto) presto.close(); });

      var main = document.querySelector("main");
      var splash = document.querySelector(".splash");
      var simbolo = document.querySelector(".simbolo");
      var fermo = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function fine() {
        if (splash.parentNode) splash.remove();
        simbolo.style.color = "#fff";
        main.classList.add("pronta");
      }
      if (fermo || !simbolo.animate) { simbolo.style.color = "#fff"; setTimeout(fine, fermo ? 600 : 1800); return; }

      // Un solo simbolo, quello della pagina: parte al centro dello schermo e più piccolo, gira e
      // cambia colore, poi torna al suo posto. L'ultimo fotogramma è la sua posizione vera, quindi
      // alla fine non c'è nessuno scambio e nessuno scatto.
      var r = simbolo.getBoundingClientRect();
      var cx = window.innerWidth / 2 - (r.left + r.width / 2);
      var cy = window.innerHeight / 2 - (r.top + r.height / 2);
      var s0 = 120 / r.width;
      var inizio = "translate(" + cx + "px, " + cy + "px) scale(" + s0 + ")";
      var volo = simbolo.animate([
        { transform: inizio + " rotate(0deg)", color: "#2A1C44", offset: 0 },
        { transform: inizio + " rotate(360deg)", color: "#ffffff", offset: 0.66, easing: "cubic-bezier(0.45, 0, 0.2, 1)" },
        { transform: "translate(0px, 0px) scale(1) rotate(360deg)", color: "#ffffff", offset: 1 }
      ], { duration: 2500, delay: 250, easing: "linear", fill: "both" });
      volo.onfinish = fine;
      setTimeout(function () { if (splash.parentNode) fine(); }, 3600);
    })();
  </script>
</body>
</html>
