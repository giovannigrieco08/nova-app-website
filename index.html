  <style>
    @font-face { font-family: "Inter"; src: url("/fonts/Inter-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("/fonts/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("/fonts/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

    :root {
      --viola: #402B63;
      --mezzo: #2B3155;
      --notte: #0A112B;
      --testo: #FFFFFF;
      --testo-2: rgba(255, 255, 255, 0.72);
      --bordo: rgba(255, 255, 255, 0.22);
      --gradiente: linear-gradient(180deg, var(--viola) 0%, var(--mezzo) 52%, var(--notte) 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--notte); }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--testo);
      background: var(--gradiente) fixed;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
    }
    /* Il bagliore dietro il simbolo, come nell'icona. */
    .bagliore {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 30%, rgba(142, 127, 192, 0.35) 0%, rgba(142, 127, 192, 0) 45%);
    }

    main {
      position: relative;
      min-height: 100svh;
      max-width: 420px; margin: 0 auto;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: calc(env(safe-area-inset-top) + 12svh) 24px calc(env(safe-area-inset-bottom) + 28px);
    }
    .simbolo { width: 132px; height: 133px; color: var(--testo); filter: drop-shadow(0 8px 30px rgba(10, 17, 43, 0.5)); }
    h1 { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; margin-top: 28px; }
    .motto { font-size: 18px; color: var(--testo-2); margin-top: 8px; }

    .scarica { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 52px; }
    .pulsante {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 60px; padding: 0 22px; border-radius: 30px;
      font-size: 18px; font-weight: 600; text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease;
    }
    .pulsante:active { transform: scale(0.98); }
    .pulsante:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .pulsante svg { width: 24px; height: 24px; flex: 0 0 auto; }
    .pieno { background: #fff; color: var(--viola); }
    .vuoto { color: #fff; border: 1.5px solid var(--bordo); background: rgba(255, 255, 255, 0.06); }

    .aiuto {
      margin-top: 18px; font-size: 15px; color: var(--testo-2);
      background: none; border: 0; font-family: inherit; text-decoration: underline; text-underline-offset: 3px;
      padding: 10px; cursor: pointer;
    }
    .istruzioni {
      display: none; width: 100%; margin-top: 4px; padding: 16px 18px; text-align: left;
      border-radius: 18px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--bordo);
      font-size: 15px; line-height: 1.55; color: var(--testo-2);
    }
    .istruzioni.aperte { display: block; }
    .istruzioni ol { margin-left: 18px; }
    .istruzioni li + li { margin-top: 6px; }

    footer { margin-top: auto; padding-top: 48px; font-size: 13px; color: rgba(255, 255, 255, 0.55); }
    footer a { color: inherit; text-decoration: none; padding: 6px 8px; display: inline-block; }

    /* La schermata iniziale: il simbolo gira e, girando, passa da viola su bianco a bianco su viola. */
    .splash {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      background: var(--gradiente);
      animation: splash-via 0.45s ease 2.1s forwards;
    }
    .splash::before {
      content: ""; position: absolute; inset: 0; background: #fff;
      animation: splash-bianco 1.6s ease-in-out 0.25s forwards;
    }
    .splash .simbolo-splash {
      position: relative; width: 120px; height: 121px; color: var(--viola);
      animation: splash-gira 1.6s cubic-bezier(0.65, 0, 0.35, 1) 0.25s forwards;
    }
    @keyframes splash-bianco { to { opacity: 0; } }
    @keyframes splash-gira { from { transform: rotate(0deg); color: var(--viola); } to { transform: rotate(360deg); color: #fff; } }
    @keyframes splash-via { to { opacity: 0; visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .splash .simbolo-splash { animation: splash-colore 0.6s ease forwards; }
      .splash::before { animation-duration: 0.6s; }
      .splash { animation-delay: 0.9s; }
      @keyframes splash-colore { to { color: #fff; } }
    }
  </style>
</head>

  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(ua);
      var a = document.getElementById("android"), i = document.getElementById("ios");
      // Il pulsante del telefono che guarda va per primo, pieno.
      if (android) {
        a.parentNode.insertBefore(a, i);
        a.className = "pulsante pieno"; i.className = "pulsante vuoto";
      }
      var b = document.querySelector(".aiuto"), box = document.getElementById("istruzioni");
      if (ios) b.style.display = "none";
      b.addEventListener("click", function () {
        var aperte = box.classList.toggle("aperte");
        b.setAttribute("aria-expanded", aperte ? "true" : "false");
      });
      // La schermata iniziale si toglie dal DOM quando ha finito.
      var s = document.querySelector(".splash");
      s.addEventListener("animationend", function (e) { if (e.animationName === "splash-via") s.remove(); });
      setTimeout(function () { if (s.parentNode) s.remove(); }, 3500);
    })();
  </script>
